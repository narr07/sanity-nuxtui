packages:
  - apps/*

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - react-dom@19.3.1
  - react@19.3.1
  - '@iconify-json/vscode-icons@1.2.89'
  - '@takumi-rs/core-darwin-arm64@2.16.2'
  - '@takumi-rs/core-darwin-x64@2.16.2'
  - '@takumi-rs/core-linux-arm64-gnu@2.16.2'
  - '@takumi-rs/core-linux-arm64-musl@2.16.2'
  - '@takumi-rs/core-linux-x64-gnu@2.16.2'
  - '@takumi-rs/core-linux-x64-musl@2.16.2'
  - '@takumi-rs/core-win32-arm64-msvc@2.16.2'
  - '@takumi-rs/core-win32-x64-msvc@2.16.2'
  - '@takumi-rs/core@2.16.2'
  - '@takumi-rs/helpers@2.16.2'
  - '@takumi-rs/wasm@2.16.2'
